name: Update BID tenders snapshot

on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "35 8 * * *"
    - cron: "55 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set extraction timestamp
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "NOW=$NOW" >> "$GITHUB_ENV"
          echo "Extraction timestamp: $NOW"

      - name: Download BID tenders
        run: |
          set -e

          URL="https://bidfa-admin.connectamericas.com/items/tenders?filter[status]=approved&limit=501&filter[date_close][_gte]=${NOW}"

          MAX_RETRIES=6
          BASE_WAIT=5
          SUCCESS=false

          echo "Querying BID endpoint..."
          echo "$URL"

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "Attempt $ATTEMPT/$MAX_RETRIES"

            rm -f latest.tmp.json

            HTTP_STATUS=$(curl \
              --globoff \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 90 \
              --write-out "%{http_code}" \
              --output latest.tmp.json \
              "$URL" || true)

            echo "HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              if [ -s latest.tmp.json ]; then
                if jq empty latest.tmp.json >/dev/null 2>&1; then
                  if jq -e '.data | type == "array"' latest.tmp.json >/dev/null 2>&1; then
                    echo "Valid BID JSON received"
                    SUCCESS=true
                    break
                  else
                    echo "JSON received, but .data is missing or not an array"
                  fi
                else
                  echo "Response is not valid JSON"
                  echo "Response preview:"
                  head -c 500 latest.tmp.json || true
                  echo ""
                fi
              else
                echo "Empty response body"
              fi
            elif [ "$HTTP_STATUS" = "429" ] || \
                 [ "$HTTP_STATUS" = "500" ] || \
                 [ "$HTTP_STATUS" = "502" ] || \
                 [ "$HTTP_STATUS" = "503" ] || \
                 [ "$HTTP_STATUS" = "504" ]; then
              echo "Temporary BID server/gateway error"
            else
              echo "Unexpected HTTP status"
            fi

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              WAIT=$((BASE_WAIT * ATTEMPT))
              echo "Retrying in ${WAIT}s..."
              sleep "$WAIT"
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "BID endpoint failed after $MAX_RETRIES attempts."
            echo "No snapshot will be published."
            exit 1
          fi

      - name: Validate JSON
        run: |
          if [ ! -s latest.tmp.json ]; then
            echo "latest.tmp.json is empty"
            exit 1
          fi

          if ! jq empty latest.tmp.json >/dev/null 2>&1; then
            echo "Invalid JSON"
            exit 1
          fi

          if ! jq -e '.data | type == "array"' latest.tmp.json >/dev/null; then
            echo "Property .data does not exist or is not an array"
            exit 1
          fi

      - name: Count records
        run: |
          TOTAL=$(jq '.data | length' latest.tmp.json)

          echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"
          echo "BID records retrieved: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "No BID records returned"
            exit 1
          fi

      - name: Validate coverage
        run: |
          LIMIT=501

          echo "Requested limit: $LIMIT"
          echo "Retrieved records: $TOTAL"

          if [ "$TOTAL" -ge "$LIMIT" ]; then
            echo "Potential truncation detected."
            echo "Coverage complete: false"
            exit 1
          fi

          echo "Coverage complete: true"

      - name: Prepare latest.json
        run: |
          cp latest.tmp.json latest.json

      - name: Calculate SHA256
        run: |
          SHA256=$(sha256sum latest.json | awk '{print $1}')

          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "Snapshot SHA256: $SHA256"

      - name: Generate metadata.json
        run: |
          jq -n \
            --arg source "BID for the Americas" \
            --arg endpoint "https://bidfa-admin.connectamericas.com/items/tenders" \
            --arg extracted_at "$NOW" \
            --arg status "approved" \
            --arg date_close_gte "$NOW" \
            --argjson total_records "$TOTAL" \
            --argjson limit_requested 501 \
            --argjson coverage_complete true \
            --arg validation_status "OK" \
            --arg sha256 "$SHA256" \
            '{
              source: $source,
              endpoint: $endpoint,
              extracted_at: $extracted_at,
              filters: {
                status: $status,
                date_close_gte: $date_close_gte
              },
              total_records: $total_records,
              limit_requested: $limit_requested,
              coverage_complete: $coverage_complete,
              validation_status: $validation_status,
              sha256: $sha256
            }' > metadata.json

      - name: Verify published count
        run: |
          JSON_TOTAL=$(jq '.data | length' latest.json)
          META_TOTAL=$(jq '.total_records' metadata.json)

          echo "latest.json records: $JSON_TOTAL"
          echo "metadata.json records: $META_TOTAL"

          if [ "$JSON_TOTAL" -ne "$META_TOTAL" ]; then
            echo "COUNT_MISMATCH"
            exit 1
          fi

          if [ "$META_TOTAL" -ge 501 ]; then
            echo "Potential truncation in published snapshot"
            exit 1
          fi

          COVERAGE=$(jq -r '.coverage_complete' metadata.json)
          STATUS=$(jq -r '.validation_status' metadata.json)

          if [ "$COVERAGE" != "true" ]; then
            echo "coverage_complete is not true"
            exit 1
          fi

          if [ "$STATUS" != "OK" ]; then
            echo "validation_status is not OK"
            exit 1
          fi

          echo "Validation status: OK"

      - name: Show metadata
        run: |
          echo "=========================================="
          echo "BID metadata"
          echo "=========================================="
          cat metadata.json
          echo ""
          echo "=========================================="

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json metadata.json

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Update BID tenders snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
