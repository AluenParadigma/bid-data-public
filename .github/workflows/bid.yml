      - name: Obtener licitaciones vigentes del BID
        shell: bash
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          URL="https://bidfa-admin.connectamericas.com/items/tenders?filter[status]=approved&limit=501&filter[date_close][_gte]=${NOW}"

          echo "Consultando: $URL"

          curl --globoff \
               --fail \
               --silent \
               --show-error \
               --location \
               "$URL" \
               -o latest.json

          python - <<'PY'
          import json

          with open("latest.json", "r", encoding="utf-8") as f:
              payload = json.load(f)

          data = payload.get("data")

          if not isinstance(data, list):
              raise SystemExit("ERROR: la respuesta no contiene un array 'data'")

          print(f"Licitaciones descargadas: {len(data)}")

          if len(data) == 0:
              raise SystemExit("ERROR: el endpoint devolvió 0 licitaciones")
          PY
