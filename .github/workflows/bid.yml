name: Actualizar BID

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener licitaciones vigentes del BID
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          URL="https://bidfa-admin.connectamericas.com/items/tenders?filter[status]=approved&limit=501&filter[date_close][_gte]=$NOW"

          echo "Consultando endpoint BID..."

          curl -g -f -sS -L "$URL" -o latest.json

          TOTAL=$(jq '.data | length' latest.json)

          echo "Licitaciones descargadas: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: el endpoint devolvió 0 licitaciones"
            exit 1
          fi

      - name: Guardar copia histórica
        run: |
          mkdir -p archive
          cp latest.json "archive/$(date -u +%Y-%m-%d).json"

      - name: Publicar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json archive/

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar licitaciones BID $(date -u +%Y-%m-%d)"
            git push
          fi
